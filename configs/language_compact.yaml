# Capacity/budget reduction only; retains character LM and 256-token training.
model: conditioned
task: shakespeare
embedding_dim: 32
hidden_dim: 64
latent_dim: 64
field_width: 64
transformer_ff: 128
seq_len: 256
eval_lengths: [256, 512, 1024, 2048]
batch_size: 8
accumulation_steps: 2
train_steps: 500
warmup_steps: 20
eval_every: 100
eval_batches: 4
amp: true
output_dir: results/language_compact
