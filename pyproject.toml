[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conditioned-node-lm"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.7,<2.8", "numpy>=1.24", "PyYAML>=6", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
